name: 🔄 Auto Sync Upstream & Auto Deploy

on:
  schedule:
    # 每天凌晨 04:00 (UTC) 自动检查并同步上游更新
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync-upstream:
    name: 🔍 Check and Sync Upstream
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Config Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🌐 Fetch Upstream
        run: |
          git remote add upstream https://github.com/maillab/cloud-mail.git || true
          git fetch upstream main

      - name: ⚡ Check for Upstream Updates
        id: check_update
        run: |
          LOCAL_REV=$(git rev-parse HEAD)
          UPSTREAM_REV=$(git rev-parse upstream/main)
          echo "Local SHA: $LOCAL_REV"
          echo "Upstream SHA: $UPSTREAM_REV"

          if [ "$LOCAL_REV" != "$UPSTREAM_REV" ]; then
            echo "🚀 Upstream has new updates! Syncing..."
            git merge upstream/main --ff-only || git merge upstream/main -m "chore: auto sync from upstream maillab/cloud-mail"
            git push origin main
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Local is already fully up to date with upstream."
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Trigger Cloudflare Deployment
        if: steps.check_update.outputs.has_update == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering deploy-cloudflare.yml..."
          gh workflow run deploy-cloudflare.yml --repo ${{ github.repository }}
